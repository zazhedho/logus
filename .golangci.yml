version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly
  relative-path-mode: gomod

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - bodyclose
    - dupl
    - errorlint
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - noctx
    - prealloc
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unused
  settings:
    dupl:
      threshold: 200
    misspell:
      locale: US
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - noctx

formatters:
  enable:
    - gofmt
